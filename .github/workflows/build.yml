name: build

on:
  push:
    # Every branch: a build that only runs after merging cannot tell you
    # whether the branch was mergeable.
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A tag build publishes a release; everything else just uploads artifacts.
permissions:
  contents: write

jobs:
  test:
    name: test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # portaudio and libevdev are needed to build pyaudio and evdev;
          # gobject/gtk4 so the HUD module imports during collection.
          sudo apt-get install -y \
            portaudio19-dev libevdev-dev \
            python3-gi gir1.2-gtk-4.0 libgtk-4-dev libcairo2-dev

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        # Only the checks that catch real breakage; style is not gated.
        run: ruff check src/ tests/ --select F,E9

      - name: Test
        # The GTK and evdev suites need a session bus and real input devices,
        # so they are skipped here rather than faked into passing.
        run: pytest -q -p no:cacheprovider

  linux:
    name: package (linux)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Assemble the installer bundle
        run: |
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          STAGE="whisper-flow-${VERSION}-linux"
          mkdir -p "$STAGE"
          cp -r packaging/linux/* "$STAGE"/
          cp dist/*.whl "$STAGE"/
          cp README.md "$STAGE"/
          # Install from the bundled wheel rather than a source checkout.
          sed -i 's|pip install --quiet "$SRC_DIR"|pip install --quiet "$SRC_DIR"/*.whl|' "$STAGE/install.sh"
          sed -i 's|SRC_DIR="$(cd "$(dirname "${BASH_SOURCE\[0\]}")/../.." \&\& pwd)"|SRC_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" \&\& pwd)"|' "$STAGE/install.sh"
          mkdir -p "$STAGE/packaging/linux"
          cp packaging/linux/*.in "$STAGE/packaging/linux/"
          tar czf "${STAGE}.tar.gz" "$STAGE"
          echo "ARTIFACT=${STAGE}.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: |
            ${{ env.ARTIFACT }}
            dist/*.whl
            dist/*.tar.gz

  windows:
    name: package (windows)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # pipwin-free: PyAudio publishes Windows wheels from 0.2.14.
          pip install "pyaudio>=0.2.14"
          pip install -e .
          pip install pyinstaller

      - name: Confirm the package imports without the Linux modules
        # The whole point of the platform split. If this fails, the frozen
        # build would fail the same way on a user's machine.
        run: |
          python -c "import whisper_flow.system_win, whisper_flow.hotkey_win; print('windows modules OK')"
          python -c "import whisper_flow.hud_win; print('hud OK')"
          python -c "from whisper_flow.daemon import WhisperFlowDaemon; print('daemon imports OK')"

      - name: Build
        working-directory: packaging/windows
        run: pyinstaller --noconfirm --clean whisper-flow.spec

      - name: Stage the release folder
        shell: bash
        run: |
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          mv packaging/windows/dist/whisper-flow "whisper-flow-${VERSION}-windows"
          cp packaging/windows/README-windows.md "whisper-flow-${VERSION}-windows/README.md"
          echo "ARTIFACT=whisper-flow-${VERSION}-windows" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ${{ env.ARTIFACT }}

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip the Windows folder
        run: |
          cd artifacts/windows-build && zip -r ../windows-build.zip . && cd -

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux-installer/*.tar.gz
            artifacts/linux-installer/dist/*.whl
            artifacts/windows-build.zip
          generate_release_notes: true
