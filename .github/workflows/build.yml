name: build

on:
  push:
    # Every branch: a build that only runs after merging cannot tell you
    # whether the branch was mergeable.
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A tag build publishes a release; everything else just uploads artifacts.
permissions:
  contents: write

jobs:
  test:
    name: test (linux)
    runs-on: ubuntu-latest
    # pystray resolves a backend when it is imported, and with gi now visible
    # it picks GTK - meaning GTK 3, which is not installed here and cannot
    # share a process with the GTK 4 the app itself uses. Its X11 backend is
    # what this job has always actually run on; now it is asked for by name.
    env:
      PYSTRAY_BACKEND: xorg
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # portaudio and libevdev are needed to build pyaudio and evdev;
          # gobject/gtk4/libadwaita so the HUD and the settings window import.
          # gir1.2-adw-1 is what the settings tests probe for: without it all
          # eighteen skipped here and Windows was the only job running them,
          # which is how a test that read back its own stub reached master.
          sudo apt-get install -y \
            portaudio19-dev libevdev-dev \
            python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 \
            libgtk-4-dev libcairo2-dev \
            xvfb

      - name: Install
        # The runner's own python3, not setup-python's: PyGObject comes from
        # apt and lives in /usr/lib/python3/dist-packages, which setup-python's
        # interpreter cannot see. It is also PEP 668 externally managed, so a
        # venv with system site packages is the way to keep apt's gi visible
        # while still installing this package - the same shape as the Windows
        # job's MSYS2 venv.
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Lint
        # Only the checks that catch real breakage; style is not gated.
        run: .venv/bin/ruff check src/ tests/ --select F,E9

      - name: Test
        # Under xvfb because pystray resolves its backend at import time and
        # its X11 one refuses to load without a display.
        run: xvfb-run -a .venv/bin/pytest -q -p no:cacheprovider

      - name: Confirm the settings-window tests really ran
        # They are skipped whenever GTK4, libadwaita or a display is missing,
        # and a skip is silent: this job reported success for months while
        # every one of them sat out. Skips here mean the environment lost
        # something, not that there is nothing to test.
        run: |
          out=$(xvfb-run -a .venv/bin/pytest tests/test_settings_gtk.py \
                  -q -p no:cacheprovider 2>&1) || true
          echo "$out"
          passed=$(echo "$out" | grep -oE '[0-9]+ passed' \
                   | grep -oE '^[0-9]+' || true)
          skipped=$(echo "$out" | grep -oE '[0-9]+ skipped' \
                    | grep -oE '^[0-9]+' || echo 0)
          if [ -z "$passed" ] || [ "$passed" -lt 1 ]; then
            echo "the settings-window tests did not run at all"; exit 1
          fi
          if [ "$skipped" -ne 0 ]; then
            echo "$skipped settings-window tests skipped; GTK4, libadwaita"
            echo "or the display is missing on this runner"; exit 1
          fi
          echo "settings-window tests run here: $passed"

  test-windows:
    name: test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # The UI is GTK4, and PyGObject has no PyPI wheels for Windows: MSYS2's
      # UCRT64 Python plus its GTK4 stack is the supported route.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-portaudio
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python-pydantic-core
            mingw-w64-ucrt-x86_64-python-webrtcvad
            mingw-w64-ucrt-x86_64-python-numpy
            mingw-w64-ucrt-x86_64-python-pillow
            mingw-w64-ucrt-x86_64-python-pywin32

      - name: Install
        shell: msys2 {0}
        run: |
          # MSYS2's Python is PEP 668 externally managed. A venv with system
          # site packages keeps pacman's python-gobject visible inside it.
          python -m venv --system-site-packages .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          # No pyaudio wheel for MSYS2 python, and its setup.py passes the
          # MSVC-only /MT to any compiler on win32: patch that out and build
          # against the portaudio above.
          work=$(mktemp -d)
          # Its win32 branch links portaudio only when VCPKG_PATH is set;
          # the UCRT64 prefix plays that role (include + lib are both there).
          export VCPKG_PATH="$(cygpath -w /ucrt64)"
          pip download --no-deps --no-binary pyaudio "pyaudio>=0.2.14" -d "$work"
          mkdir "$work/src"
          tar -C "$work/src" --strip-components=1 -xf "$work"/[Pp]y[Aa]udio-*.tar.gz
          sed -i "s|[\"']/MT[\"']||g" "$work/src/setup.py"
          pip install "$work/src"
          # velopack has no MSYS2 wheel and is lazily imported and fully
          # mocked in tests. The dev extra's linters are Rust builds PyPI
          # cannot serve here either; pytest is all it needs.
          sed -i -e "/velopack/d" pyproject.toml
          pip install -e . pytest

      - name: Test
        # The whole suite, plus test_windows_native.py, which only does
        # anything here. Everywhere else the Win32 calls are stubbed, so this
        # is the only job that proves the clipboard, the key-state polling
        # and the overlay actually work against the real API - the gap that
        # let a broken clipboard ship.
        shell: msys2 {0}
        run: |
          source .venv/bin/activate
          pytest -q -p no:cacheprovider

      - name: Confirm the Windows-only tests really ran
        # skipif on the wrong condition would make this job silently vacuous.
        # The count is parsed rather than pattern-matched: "0 tests collected"
        # is a substring of "10 tests collected", which failed this step on a
        # run where all ten had in fact passed.
        shell: msys2 {0}
        run: |
          source .venv/bin/activate
          out=$(pytest tests/test_windows_native.py -q -p no:cacheprovider --collect-only 2>&1)
          echo "$out"
          collected=$(echo "$out" | grep -oE '[0-9]+ tests? collected' | grep -oE '^[0-9]+' || true)
          if [ -z "$collected" ]; then
            echo "could not read a test count from pytest"; exit 1
          fi
          if [ "$collected" -lt 1 ]; then
            echo "test_windows_native.py collected nothing on Windows"; exit 1
          fi
          echo "Windows-only tests collected: $collected"

  linux:
    name: package (linux)
    needs: test
    # 22.04, not latest: the AppImage inherits this glibc. Building on an
    # older base is what makes one file run on Ubuntu, Fedora, Arch, Mint,
    # Debian bookworm, Pop!_OS and most current desktops. A 24.04 build would
    # refuse to start on 22.04.
    runs-on: ubuntu-22.04
    env:
      PYSTRAY_BACKEND: xorg
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # deadsnakes: 22.04's python3 is 3.10; the project needs >=3.11.
          # Building on 22.04 still keeps glibc old enough for most desktops.
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y \
            python3.12 python3.12-venv python3.12-dev \
            gir1.2-gtk-4.0 gir1.2-adw-1 \
            libgtk-4-1 libgtk-4-dev libadwaita-1-0 libadwaita-1-dev \
            libcairo2-dev libgirepository1.0-dev gobject-introspection \
            portaudio19-dev libportaudio2 libevdev-dev \
            pkg-config meson ninja-build cmake \
            curl file fuse libfuse2 \
            xvfb adwaita-icon-theme
          # gtk4-layer-shell is not in 22.04; build it so the Wayland HUD
          # ships inside the AppImage and works without a distro package.
          git clone --depth 1 --branch v1.0.3 \
            https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          # vapi needs vapigen (Vala); we only need the .so + typelib for the
          # AppImage, so skip VAPI generation. smoke-tests pull in examples.
          meson setup /tmp/gtk4-layer-shell/build /tmp/gtk4-layer-shell \
            -Dexamples=false -Ddocs=false -Dtests=false \
            -Dsmoke-tests=false -Dvapi=false \
            --prefix=/usr
          ninja -C /tmp/gtk4-layer-shell/build
          sudo ninja -C /tmp/gtk4-layer-shell/build install
          sudo ldconfig

      - name: Install Python package and PyInstaller
        run: |
          # 3.12 venv with pip PyGObject (apt's gi is for system 3.10 only).
          # Typelibs and .so still come from apt / the layer-shell build.
          #
          # Pin PyGObject < 3.50: 3.50+ needs girepository-2.0 (GLib 2.80),
          # which Ubuntu 22.04 does not ship. 3.48 still builds against
          # girepository-1.0 from apt.
          python3.12 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install 'PyGObject>=3.46,<3.50' 'pycairo>=1.21'
          .venv/bin/pip install -e .
          .venv/bin/pip install "pyinstaller>=6.0"
          .venv/bin/python -c "import gi; gi.require_version('Gtk','4.0'); from gi.repository import Gtk; print('gi OK', Gtk.get_major_version())"

      - name: Freeze with PyInstaller
        working-directory: packaging/linux
        run: |
          source "$GITHUB_WORKSPACE/.venv/bin/activate"
          python -m PyInstaller --noconfirm --clean whisper-flow.spec
          test -x dist/whisper-flow/whisper-flow
          ls -la dist/whisper-flow | head

      - name: Prove the frozen app imports GTK
        # Under xvfb: no real desktop, but Gtk.init_check and typelib load
        # still fail if the bundle is incomplete.
        run: |
          source .venv/bin/activate
          export WHISPER_FLOW_SELFTEST_OUT="$PWD/selftest.txt"
          xvfb-run -a packaging/linux/dist/whisper-flow/whisper-flow --selftest \
            || true
          cat selftest.txt || true
          # Require at least a clean Gtk import; display init may vary.
          grep -q "Gtk 4 + Adw import OK" selftest.txt

      - name: Bundle the speech engine and a model
        # Same idea as Windows: offline dictation from the first launch.
        # base.en-q8_0 keeps up on any CPU and fits a release asset.
        run: |
          set -euo pipefail
          DIST=packaging/linux/dist/whisper-flow
          mkdir -p "$DIST/engine" "$DIST/models"
          REL=https://github.com/ggml-org/whisper.cpp/releases/download/v1.9.1
          curl -fsSL "$REL/whisper-bin-ubuntu-x64.tar.gz" -o /tmp/engine.tar.gz
          mkdir -p /tmp/engine
          tar -xzf /tmp/engine.tar.gz -C /tmp/engine
          # Archive layout varies; find whisper-server and its sibling libs.
          SERVER=$(find /tmp/engine -type f -name whisper-server | head -1)
          test -n "$SERVER"
          cp -a "$(dirname "$SERVER")"/. "$DIST/engine/"
          curl -fsSL \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en-q8_0.bin" \
            -o "$DIST/models/ggml-base.en-q8_0.bin"
          # App icon next to the binary for the AppImage. Use the venv —
          # system python3 has no Pillow (and on 22.04 is 3.10).
          .venv/bin/python -c "
          from pathlib import Path
          from whisper_flow.icon import APP_COLOR, draw_mic
          draw_mic(256, APP_COLOR).save(Path('$DIST') / 'whisper-flow.png', format='PNG')
          print('icon ok')
          "
          test -s "$DIST/engine/whisper-server" || test -s "$DIST/engine/whisper-server.exe" \
            || find "$DIST/engine" -name 'whisper-server*' | grep -q .
          test -s "$DIST/models/ggml-base.en-q8_0.bin"
          du -sh "$DIST" "$DIST/engine" "$DIST/models"

      - name: Build AppImage
        run: |
          VERSION=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            PACK_VERSION="${GITHUB_REF#refs/tags/v}"
          else
            SERIES=$(echo "$VERSION" | cut -d. -f1-2)
            PACK_VERSION="${SERIES}.${GITHUB_RUN_NUMBER}"
          fi
          # Stamp so the tray / about text can show which build this is.
          echo "$PACK_VERSION" > packaging/linux/dist/whisper-flow/BUILD.txt
          chmod +x packaging/linux/make-appimage.sh
          APPIMAGE="WhisperFlow-${PACK_VERSION}-x86_64.AppImage"
          packaging/linux/make-appimage.sh \
            packaging/linux/dist/whisper-flow \
            "$PACK_VERSION" \
            "$APPIMAGE"
          test -x "$APPIMAGE"
          test -s "$APPIMAGE"
          file "$APPIMAGE" | grep -qiE 'ELF|AppImage'
          echo "PACK_VERSION=${PACK_VERSION}" >> "$GITHUB_ENV"
          echo "APPIMAGE=${APPIMAGE}" >> "$GITHUB_ENV"
          ls -lah "$APPIMAGE"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: |
            WhisperFlow-*-x86_64.AppImage
          retention-days: >-
            ${{ (github.ref == 'refs/heads/master' ||
                 startsWith(github.ref, 'refs/tags/v')) && 30 || 5 }}

  windows:
    name: package (windows)
    # Both: the Linux job covers the shared logic, the Windows one covers the
    # Win32 calls this package actually runs on.
    needs: [test, test-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # GTK4 UI in the frozen build means MSYS2's Python and GTK stack, and
      # the spec collects the runtime from this prefix (GTK_PREFIX).
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-portaudio
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python-pydantic-core
            mingw-w64-ucrt-x86_64-python-webrtcvad
            mingw-w64-ucrt-x86_64-python-numpy
            mingw-w64-ucrt-x86_64-python-pillow
            mingw-w64-ucrt-x86_64-python-pywin32
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-pyinstaller

      - name: Install
        shell: msys2 {0}
        run: |
          # MSYS2's Python is PEP 668 externally managed. A venv with system
          # site packages keeps pacman's python-gobject visible inside it.
          python -m venv --system-site-packages .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          # pipwin-free: PyAudio publishes Windows wheels from 0.2.14.
          # No pyaudio wheel for MSYS2 python, and its setup.py passes the
          # MSVC-only /MT to any compiler on win32: patch that out and build
          # against the portaudio above.
          work=$(mktemp -d)
          # Its win32 branch links portaudio only when VCPKG_PATH is set;
          # the UCRT64 prefix plays that role (include + lib are both there).
          export VCPKG_PATH="$(cygpath -w /ucrt64)"
          # jiter is a Rust build whose link looks for libpython3.14.dll.a.
          export RUSTFLAGS="-L native=$(cygpath -w /ucrt64)/lib"
          pip download --no-deps --no-binary pyaudio "pyaudio>=0.2.14" -d "$work"
          mkdir "$work/src"
          tar -C "$work/src" --strip-components=1 -xf "$work"/[Pp]y[Aa]udio-*.tar.gz
          sed -i "s|[\"']/MT[\"']||g" "$work/src/setup.py"
          pip install "$work/src"
          sed -i "/velopack/d" pyproject.toml
          pip install -e .
          # velopack ships a stable-ABI extension: the win_amd64 wheel loads
          # on MSYS2's CPython too; only pip's tag check disagrees.
          vpdir=$(mktemp -d)
          pip download --only-binary :all: --platform win_amd64 \
              --python-version 312 --no-deps velopack -d "$vpdir"
          python -c "import glob,site,sys,zipfile; w=glob.glob(sys.argv[1]+'/*.whl')[0]; zipfile.ZipFile(w).extractall(site.getsitepackages()[0]); print('velopack from', w)" "$vpdir"

      - name: Confirm the package imports without the Linux modules
        # The whole point of the platform split. If this fails, the frozen
        # build would fail the same way on a user's machine.
        shell: msys2 {0}
        run: |
          source .venv/bin/activate
          python -c "import whisper_flow.system_win, whisper_flow.hotkey_win; print('windows modules OK')"
          python -c "import whisper_flow.hud_app, whisper_flow.blur_win; print('hud + blur OK')"
          python -c "import whisper_flow.blur_win as b; print('runner build', b.windows_build(), 'supported', b.is_supported())"
          python -c "from whisper_flow.daemon import WhisperFlowDaemon; print('daemon imports OK')"

      - name: Build
        shell: msys2 {0}
        working-directory: packaging/windows
        # UCRT64's Python is a native Windows build: it wants the prefix in
        # Windows form (C:\msys64\ucrt64), not the MSYS form (/ucrt64).
        #
        # `python -m PyInstaller`, not the `pyinstaller` on PATH. PyInstaller
        # comes from pacman, so that script is /ucrt64/bin/pyinstaller.exe and
        # its shebang runs the *system* interpreter - which cannot see the
        # editable whisper_flow in .venv, and would analyse a spec whose every
        # hiddenimport is missing. The module form runs under the activated
        # venv, which sees both it (via --system-site-packages) and us.
        run: |
          source "$GITHUB_WORKSPACE/.venv/bin/activate"
          python -c "import PyInstaller; print('PyInstaller', PyInstaller.__version__)"
          GTK_PREFIX="$(cygpath -w /ucrt64)" \
            python -m PyInstaller --noconfirm --clean whisper-flow.spec

      - name: Prove the frozen app can open a GTK window
        # The build being green says nothing about the bundled GTK runtime:
        # typelibs are data, and a missing one fails when the first window
        # opens, on the user's machine. That is exactly how 0.3.90 shipped -
        # "ValueError: Namespace Gtk not available" from the overlay.
        #
        # Start-Process because the exe is windowed (console=False), so pwsh
        # does not wait for it and there is no stdout to read; --selftest
        # writes its report to the file named here.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "packaging/windows/dist/whisper-flow/whisper-flow.exe"
          if (-not (Test-Path $exe)) { throw "no frozen exe at $exe" }
          $env:WHISPER_FLOW_SELFTEST_OUT = "$PWD/selftest.txt"
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest" `
                             -Wait -PassThru
          if (Test-Path selftest.txt) { Get-Content selftest.txt | Write-Host }
          if ($p.ExitCode -ne 0) {
            throw "the frozen GTK runtime is broken (exit $($p.ExitCode))"
          }

      - name: Bundle the speech engine and a model
        # So the app transcribes the moment it is installed, with no network
        # and no setup step.
        #
        # base.en, not something larger. This one model has to be right on
        # every machine that runs the installer, from a two-core laptop to a
        # workstation, and a model too big for the CPU it lands on does not
        # transcribe slowly - it falls behind speech and is useless. base.en
        # keeps up everywhere and asks ~150MB of RAM. Machines that can do
        # better are offered better in the setup window: small.en on a strong
        # CPU, large-v3-turbo on an NVIDIA GPU. The CUDA engine and the large
        # model could not ship here anyway - together they are 2.2GB, past the
        # 2GB ceiling on a release asset.
        #
        # The 8-bit build of it, which is 78MB rather than 142MB and decodes
        # 20-25% faster on a CPU for the same transcript. Both numbers matter
        # here: it is the installer people wait on and the CPU they dictate
        # against.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist   = "packaging/windows/dist/whisper-flow"
          $engine = "$dist/engine"
          $models = "$dist/models"
          New-Item -ItemType Directory -Force -Path $engine, $models | Out-Null

          $rel = "https://github.com/ggml-org/whisper.cpp/releases/download/v1.9.1"
          Write-Host "Downloading whisper.cpp CPU engine..."
          Invoke-WebRequest "$rel/whisper-blas-bin-x64.zip" -OutFile engine.zip
          Expand-Archive engine.zip -DestinationPath engine-tmp -Force
          # The archive nests its binaries a directory deep.
          $src = Get-ChildItem engine-tmp -Recurse -Filter whisper-server.exe |
                 Select-Object -First 1
          if (-not $src) { throw "whisper-server.exe not found in the archive" }
          Copy-Item "$($src.Directory)/*" $engine -Recurse -Force
          Remove-Item engine.zip, engine-tmp -Recurse -Force

          Write-Host "Downloading ggml-base.en-q8_0..."
          Invoke-WebRequest `
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en-q8_0.bin" `
            -OutFile "$models/ggml-base.en-q8_0.bin"

          "{0:N0}MB bundled" -f ((Get-ChildItem $dist -Recurse |
            Measure-Object Length -Sum).Sum / 1MB) | Write-Host

      - name: Build the installer with Velopack
        # Velopack rather than Inno Setup, and rather than Squirrel.Windows,
        # which its own authors describe as unmaintained. Two things matter
        # here: updates are delta, so a code-only release is a few megabytes
        # instead of the ~160MB the whole installer weighs - most of which is
        # a speech model that does not change between versions - and the app
        # can update itself instead of the user fetching an installer.
        #
        # --shortcuts includes Startup, which is what makes it run at login.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Every rolling build needs a version above the last one, or the
          # updater can never find anything: the "latest" release replaces its
          # own assets, so the feed would keep advertising the same 0.3.0 that
          # is already installed and "Check for updates" would always say it is
          # current. The run number is monotonic, so the patch component
          # becomes the build counter for rolling builds. A tag is used
          # verbatim, and is what a kept release ships as.
          $declared = python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            $series = ($declared -split '\.')[0..1] -join '.'
            $version = "$series.$env:GITHUB_RUN_NUMBER"
          }
          Write-Host "declared $declared, packaging as $version"
          Copy-Item packaging/windows/README-windows.md `
                    packaging/windows/dist/whisper-flow/README.md

          # Beside the executable, for the log header to read back. The
          # version in the source is the same in every build made from a
          # commit series, so a log could not say which build it came from -
          # and so could not say whether a fix was in it.
          Set-Content -Path packaging/windows/dist/whisper-flow/BUILD.txt `
                      -Value $version -NoNewline

          dotnet tool install -g vpk
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"

          vpk pack `
            --packId WhisperFlow `
            --packVersion $version `
            --packDir packaging/windows/dist/whisper-flow `
            --mainExe whisper-flow.exe `
            --packTitle "WhisperFlow" `
            --packAuthors "Sammy Guergachi" `
            --shortcuts "Desktop,StartMenuRoot,Startup" `
            --icon packaging/windows/whisper-flow.ico `
            --outputDir installer-out
          if ($LASTEXITCODE -ne 0) { throw "vpk pack failed with $LASTEXITCODE" }

          Get-ChildItem installer-out | ForEach-Object {
            "{0}  {1:N0}MB" -f $_.Name, ($_.Length / 1MB) | Write-Host
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      # The unpacked folder is not uploaded. vpk already produces
      # WhisperFlow-win-Portable.zip from exactly those files, so sending the
      # folder as well put the whole application into the artifact a fourth
      # time - alongside the setup exe, the nupkg and that very zip. It was
      # most of a 900MB artifact, on every push, kept for the default ninety
      # days. The release job uses vpk's zip instead.
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: installer-out/*
          # A branch build is for testing a change and is worth nothing a
          # week later; master and tags feed the release and are worth
          # keeping a little longer.
          retention-days: >-
            ${{ (github.ref == 'refs/heads/master' ||
                 startsWith(github.ref, 'refs/tags/v')) && 30 || 5 }}

  release:
    name: release
    # Every merge to master publishes, and so does a version tag. Pull
    # requests build but never publish.
    #
    # A hand-started run on master publishes too. Pushes stopped raising
    # workflow events on this repository, so the only runs that happen are
    # dispatched by hand - and with this gated to push events, master moved
    # three commits ahead of the release the app updates from while every
    # dispatched run went green and published nothing. A dispatch on master
    # is a merge to master someone had to start themselves.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      &&
      (github.ref == 'refs/heads/master' ||
       github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/tags/v'))
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Needed for tomllib to read the version; this job checks out but
          # does not otherwise set up Python.
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Lay out the Windows downloads
        run: |
          # Everything Velopack produced goes up, not just the setup exe. The
          # package and the release index are the update feed: the app reads
          # them from this release's download URL to find and fetch deltas,
          # so omitting them would leave it unable to update itself.
          #
          # The artifact now holds installer-out's contents at its root - the
          # unpacked folder is no longer uploaded, so installer-out is the
          # only path in it and becomes the archive root.
          mkdir -p release-files
          cp artifacts/windows-build/* release-files/

          # The portable download is vpk's own zip, under the name people
          # were given before. It is built from the same files the unpacked
          # folder held, so re-zipping that folder only ever duplicated it.
          mv release-files/WhisperFlow-win-Portable.zip \
             release-files/whisper-flow-windows-portable.zip
          ls -la release-files

      - name: Work out what kind of release this is
        id: plan
        run: |
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # A tagged release is the stable one and keeps its history.
            echo "tag=${GITHUB_REF#refs/tags/}"        >> "$GITHUB_OUTPUT"
            echo "title=whisper-flow ${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false"                     >> "$GITHUB_OUTPUT"
            echo "rolling=false"                        >> "$GITHUB_OUTPUT"
          else
            # Master builds share one rolling tag, so the newest build is
            # always at the same URL and tags do not accumulate per merge.
            echo "tag=latest"                           >> "$GITHUB_OUTPUT"
            echo "title=Latest build (v${VERSION}, build ${GITHUB_RUN_NUMBER})" >> "$GITHUB_OUTPUT"
            echo "prerelease=true"                      >> "$GITHUB_OUTPUT"
            echo "rolling=true"                         >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.plan.outputs.tag }}"

          # The rolling release has to be removed first, tag included, or the
          # tag keeps pointing at whichever commit created it.
          if [[ "${{ steps.plan.outputs.rolling }}" == "true" ]]; then
            gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          fi

          NOTES="Built from \`${GITHUB_SHA::7}\` on $(date -u +'%Y-%m-%d %H:%M UTC').

          **Linux** — download \`WhisperFlow-*-x86_64.AppImage\` and
          double-click it. One portable build for most x86_64 desktops
          (Ubuntu 22.04+, Fedora, Arch, Mint, Debian bookworm+, Pop!_OS…).
          Bundles the app, GTK runtime, speech engine and a starter model —
          no Python install, no package manager. Hold Super+Alt to dictate.

          If the file manager will not run it: right-click → Properties →
          Allow executing file as program (browsers strip that once).
          Wayland typing works best with \`ydotool\` installed from your
          distro; hotkeys need membership in the \`input\` group.

          **Windows** — double-click \`WhisperFlow-*-Setup.exe\`. Installs
          per-user, no admin needed, starts at sign-in. Requires Windows 11
          22H2 or later. The portable zip is the same build without an
          installer."

          gh release create "$TAG" \
            --title "${{ steps.plan.outputs.title }}" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            ${{ steps.plan.outputs.prerelease == 'true' && '--prerelease' || '' }} \
            artifacts/linux-installer/WhisperFlow-*-x86_64.AppImage \
            release-files/*

  prune:
    name: prune old artifacts
    # After the builds, and whatever they did: a failed run still uploads
    # nothing worth keeping, and the artifacts from every earlier run are
    # still there taking space.
    needs: [linux, windows]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      # The default token can read Actions but not delete from it.
      actions: write
    steps:
      - name: Keep this run's artifacts and no others
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A build artifact is worth having until the next build and not
          # much beyond it, and each Windows one is several hundred MB.
          # Left alone they reached 194 artifacts and 46.7GB, which is how
          # this repository ran out of storage. retention-days bounds how
          # long one lives; this bounds how many exist.
          #
          # Failures here never fail the build. Running out of storage is
          # worth fixing, and it is not worth failing a green build over.
          # Listed to a file first, not piped into the loop. A piped while
          # runs in a subshell, so the counter it kept died with it and the
          # step reported pruning nothing while deleting hundreds of MB -
          # a log that always says zero cannot report a real failure either.
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts" \
            --jq '.artifacts[]
                  | select(.expired == false)
                  | "\(.id) \(.workflow_run.id)"' > artifacts.txt

          # Every run that has not finished, this one included. The check
          # below used to be against $GITHUB_RUN_ID alone, which spared this
          # run and nothing else - so two pushes close together meant the
          # first build's prune deleted the second build's artifacts while
          # it was still running, and that build's release step then failed
          # with "no matches found" for a tarball it had built and uploaded
          # minutes earlier. The comment already promised this; only the
          # code was missing.
          for state in in_progress queued; do
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/runs?status=$state" \
              --jq '.workflow_runs[].id' >> active.txt || true
          done
          echo "$GITHUB_RUN_ID" >> active.txt
          sort -u active.txt -o active.txt
          echo "leaving alone $(wc -l < active.txt) run(s) still in flight"

          deleted=0
          failed=0
          while read -r id run; do
            # Anything from a run still in flight is left alone; deleting a
            # concurrent build's output would be a confusing way to save
            # space.
            if grep -qx "$run" active.txt; then
              continue
            fi
            if gh api -X DELETE \
                 "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" --silent; then
              deleted=$((deleted + 1))
            else
              failed=$((failed + 1))
            fi
          done < artifacts.txt
          echo "pruned $deleted artifacts from earlier runs ($failed failed)"
