name: build

on:
  push:
    # Every branch: a build that only runs after merging cannot tell you
    # whether the branch was mergeable.
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A tag build publishes a release; everything else just uploads artifacts.
permissions:
  contents: write

jobs:
  test:
    name: test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # portaudio and libevdev are needed to build pyaudio and evdev;
          # gobject/gtk4 so the HUD module imports during collection.
          sudo apt-get install -y \
            portaudio19-dev libevdev-dev \
            python3-gi gir1.2-gtk-4.0 libgtk-4-dev libcairo2-dev \
            xvfb

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        # Only the checks that catch real breakage; style is not gated.
        run: ruff check src/ tests/ --select F,E9

      - name: Test
        # Under xvfb because pystray resolves its backend at import time and
        # its X11 one refuses to load without a display.
        run: xvfb-run -a pytest -q -p no:cacheprovider

  test-windows:
    name: test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "pyaudio>=0.2.14"
          pip install -e ".[dev]"

      - name: Test
        # The whole suite, plus test_windows_native.py, which only does
        # anything here. Everywhere else the Win32 calls are stubbed, so this
        # is the only job that proves the clipboard, the key-state polling
        # and the overlay actually work against the real API - the gap that
        # let a broken clipboard ship.
        run: pytest -q -p no:cacheprovider

      - name: Confirm the Windows-only tests really ran
        # skipif on the wrong condition would make this job silently vacuous.
        # The count is parsed rather than pattern-matched: "0 tests collected"
        # is a substring of "10 tests collected", which failed this step on a
        # run where all ten had in fact passed.
        shell: pwsh
        run: |
          $out = pytest tests/test_windows_native.py -q -p no:cacheprovider `
                 --collect-only 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch '(\d+)\s+tests?\s+collected') {
            throw "could not read a test count from pytest"
          }
          $collected = [int]$Matches[1]
          if ($collected -lt 1) {
            throw "test_windows_native.py collected nothing on Windows"
          }
          Write-Host "Windows-only tests collected: $collected"

  linux:
    name: package (linux)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Assemble the installer bundle
        run: |
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          STAGE="whisper-flow-${VERSION}-linux"
          mkdir -p "$STAGE"
          cp -r packaging/linux/* "$STAGE"/
          cp dist/*.whl "$STAGE"/
          cp README.md "$STAGE"/
          # install.sh detects the bundled wheel itself, so nothing here has
          # to rewrite it - a sed against a script it cannot test is exactly
          # how the bundle shipped broken the first time.
          tar czf "${STAGE}.tar.gz" "$STAGE"
          echo "ARTIFACT=${STAGE}.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: |
            ${{ env.ARTIFACT }}
            dist/*.whl
            dist/*.tar.gz

  windows:
    name: package (windows)
    # Both: the Linux job covers the shared logic, the Windows one covers the
    # Win32 calls this package actually runs on.
    needs: [test, test-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # pipwin-free: PyAudio publishes Windows wheels from 0.2.14.
          pip install "pyaudio>=0.2.14"
          pip install -e .
          pip install pyinstaller

      - name: Confirm the package imports without the Linux modules
        # The whole point of the platform split. If this fails, the frozen
        # build would fail the same way on a user's machine.
        run: |
          python -c "import whisper_flow.system_win, whisper_flow.hotkey_win; print('windows modules OK')"
          python -c "import whisper_flow.hud_win, whisper_flow.blur_win; print('hud + blur OK')"
          python -c "import whisper_flow.blur_win as b; print('runner build', b.windows_build(), 'supported', b.is_supported())"
          python -c "from whisper_flow.daemon import WhisperFlowDaemon; print('daemon imports OK')"

      - name: Build
        working-directory: packaging/windows
        run: pyinstaller --noconfirm --clean whisper-flow.spec

      - name: Bundle the speech engine and a model
        # So the app transcribes the moment it is installed, with no network
        # and no setup step.
        #
        # base.en, not something larger. This one model has to be right on
        # every machine that runs the installer, from a two-core laptop to a
        # workstation, and a model too big for the CPU it lands on does not
        # transcribe slowly - it falls behind speech and is useless. base.en
        # keeps up everywhere and asks ~250MB of RAM. Machines that can do
        # better are offered better in the setup window: small.en on a strong
        # CPU, large-v3-turbo on an NVIDIA GPU. The CUDA engine and the large
        # model could not ship here anyway - together they are 2.2GB, past the
        # 2GB ceiling on a release asset.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist   = "packaging/windows/dist/whisper-flow"
          $engine = "$dist/engine"
          $models = "$dist/models"
          New-Item -ItemType Directory -Force -Path $engine, $models | Out-Null

          $rel = "https://github.com/ggml-org/whisper.cpp/releases/download/v1.9.1"
          Write-Host "Downloading whisper.cpp CPU engine..."
          Invoke-WebRequest "$rel/whisper-blas-bin-x64.zip" -OutFile engine.zip
          Expand-Archive engine.zip -DestinationPath engine-tmp -Force
          # The archive nests its binaries a directory deep.
          $src = Get-ChildItem engine-tmp -Recurse -Filter whisper-server.exe |
                 Select-Object -First 1
          if (-not $src) { throw "whisper-server.exe not found in the archive" }
          Copy-Item "$($src.Directory)/*" $engine -Recurse -Force
          Remove-Item engine.zip, engine-tmp -Recurse -Force

          Write-Host "Downloading ggml-base.en..."
          Invoke-WebRequest `
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin" `
            -OutFile "$models/ggml-base.en.bin"

          "{0:N0}MB bundled" -f ((Get-ChildItem $dist -Recurse |
            Measure-Object Length -Sum).Sum / 1MB) | Write-Host

      - name: Build the installer
        # PowerShell, not bash: Git Bash rewrites arguments that look like
        # POSIX paths, and turned Inno's /O switch into a path it rejected.
        shell: pwsh
        run: |
          $version = python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          Copy-Item packaging/windows/README-windows.md `
                    packaging/windows/dist/whisper-flow/README.md

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $found = Get-ChildItem "C:\Program Files (x86)","C:\Program Files" `
                       -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
                     Select-Object -First 1
            if (-not $found) { throw "Inno Setup (ISCC.exe) not found on this runner" }
            $iscc = $found.FullName
          }
          Write-Host "using $iscc"

          & $iscc "/DAppVersion=$version" "/O$PWD\installer-out" `
                  packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

          Get-ChildItem installer-out
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Also keep the plain folder, for anyone who will not run an installer
        shell: pwsh
        run: |
          Move-Item packaging/windows/dist/whisper-flow `
                    "whisper-flow-$env:VERSION-windows"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            installer-out/*.exe
            whisper-flow-${{ env.VERSION }}-windows

  release:
    name: release
    # Every merge to master publishes, and so does a version tag. Pull
    # requests build but never publish.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' ||
       github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/tags/v'))
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Needed for tomllib to read the version; this job checks out but
          # does not otherwise set up Python.
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Lay out the Windows downloads
        run: |
          # The installer is the headline download; the folder is zipped for
          # anyone who would rather not run one.
          mkdir -p release-files
          cp artifacts/windows-build/installer-out/*.exe release-files/
          cd artifacts/windows-build
          rm -rf installer-out
          zip -qr "$GITHUB_WORKSPACE/release-files/whisper-flow-windows-portable.zip" .

      - name: Work out what kind of release this is
        id: plan
        run: |
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # A tagged release is the stable one and keeps its history.
            echo "tag=${GITHUB_REF#refs/tags/}"        >> "$GITHUB_OUTPUT"
            echo "title=whisper-flow ${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false"                     >> "$GITHUB_OUTPUT"
            echo "rolling=false"                        >> "$GITHUB_OUTPUT"
          else
            # Master builds share one rolling tag, so the newest build is
            # always at the same URL and tags do not accumulate per merge.
            echo "tag=latest"                           >> "$GITHUB_OUTPUT"
            echo "title=Latest build (v${VERSION}, build ${GITHUB_RUN_NUMBER})" >> "$GITHUB_OUTPUT"
            echo "prerelease=true"                      >> "$GITHUB_OUTPUT"
            echo "rolling=true"                         >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.plan.outputs.tag }}"

          # The rolling release has to be removed first, tag included, or the
          # tag keeps pointing at whichever commit created it.
          if [[ "${{ steps.plan.outputs.rolling }}" == "true" ]]; then
            gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          fi

          NOTES="Built from \`${GITHUB_SHA::7}\` on $(date -u +'%Y-%m-%d %H:%M UTC').

          **Linux** - unpack \`whisper-flow-*-linux.tar.gz\` and run \`install.sh\`.
          Needs GTK4, gtk4-layer-shell and ydotool; the installer checks and
          tells you what is missing.

          **Windows** - run \`whisper-flow-*-setup.exe\`. Installs per-user, no
          admin needed, and can start with you at sign-in. Requires Windows 11
          22H2 or later. The portable zip is the same build without an
          installer."

          gh release create "$TAG" \
            --title "${{ steps.plan.outputs.title }}" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            ${{ steps.plan.outputs.prerelease == 'true' && '--prerelease' || '' }} \
            artifacts/linux-installer/*.tar.gz \
            artifacts/linux-installer/dist/*.whl \
            release-files/*
